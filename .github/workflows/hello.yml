name: Rust CI

on:
  push:
    branches:
      - practice/github-actions

jobs:
  rust-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rust-ci-practice

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable

      - name: Check Rust code
        run: cargo check

      - name: Run tests
        run: cargo test

      - name: Build Rust project
        run: cargo build
